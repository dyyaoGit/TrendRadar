name: Hot News Crawler
on:
  push:
    branches: [master]
    paths: ['config/**', '.github/workflows/crawler.yml']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trendradar-collector
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync --frozen --no-dev
      - name: Collect and send morning briefing
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: uv run python -m trendradar
      - name: Preserve collected data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output
          git diff --cached --quiet || (git commit -m 'Save collected hotspot data' && git push)
